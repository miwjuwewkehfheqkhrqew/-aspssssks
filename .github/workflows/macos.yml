name: Graphical macOS Tahoe Desktop
on: workflow_dispatch

jobs:
  macos-desktop:
    runs-on: macos-latest
    steps:
      - name: Enable macOS Screen Sharing (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw mysecret -restart -agent -privs -all

      - name: Install noVNC and Cloudflare Tunnel
        run: |
          brew install novnc cloudflared

      - name: Start Desktop Stream
        run: |
          novnc --vnc localhost:5900 --listen 6080 &
          sleep 3
          cloudflared tunnel --url http://localhost:6080
